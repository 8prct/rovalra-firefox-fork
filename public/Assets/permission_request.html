<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>RoValra permission request</title>
        <style>
            :root {
                color-scheme: dark;
                font-family: system-ui, sans-serif;
                background: #18181b;
                color: #f4f4f5;
            }
            body {
                margin: 0;
                padding: 32px;
            }
            h1 {
                font-size: 20px;
                margin: 0 0 12px;
            }
            p {
                color: #d4d4d8;
                line-height: 1.5;
            }
            #permissions {
                color: #f97316;
                font-weight: 600;
            }
            .actions {
                display: flex;
                gap: 10px;
                margin-top: 28px;
            }
            button {
                border: 0;
                border-radius: 8px;
                cursor: pointer;
                padding: 10px 18px;
                font: inherit;
                font-weight: 600;
            }
            #allow {
                background: #f97316;
                color: white;
            }
            #cancel {
                background: #3f3f46;
                color: white;
            }
        </style>
    </head>
    <body>
        <h1>Allow this RoValra feature?</h1>
        <p>
            Firefox requires a direct click before granting optional access.
            This feature requests: <span id="permissions"></span>
        </p>
        <div class="actions">
            <button id="allow" type="button">Allow</button>
            <button id="cancel" type="button">Cancel</button>
        </div>
        <script src="permission_request.js"></script>
    </body>
</html>
