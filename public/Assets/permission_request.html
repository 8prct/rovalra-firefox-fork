<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>RoValra Permission Request</title>
        <style>
            body {
                background: #191b1d;
                color: #f2f4f5;
                font:
                    14px system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                margin: 0;
                padding: 24px;
            }
            button {
                background: #335fff;
                border: 0;
                border-radius: 8px;
                color: white;
                cursor: pointer;
                font-weight: 600;
                margin-right: 8px;
                padding: 10px 14px;
            }
            button.secondary {
                background: #393b3d;
            }
        </style>
    </head>
    <body>
        <h2>RoValra needs extra permission</h2>
        <p id="permission-list"></p>
        <button id="allow">Allow</button>
        <button id="deny" class="secondary">Deny</button>
        <script src="permission_request.js"></script>
    </body>
</html>
